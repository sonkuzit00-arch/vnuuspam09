services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dgd
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dgd}"
      POSTGRES_DB: dgd
    volumes:
      - dgd_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgd"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # По умолчанию слушает только сам сервер (127.0.0.1) — наружу ничего
      # не торчит. Чтобы открыть сервис коллегам по внутренней сети,
      # замените на IP внутреннего интерфейса сервера, например:
      #   - "10.0.1.5:3000:3000"
      # либо поставьте перед контейнером внутренний nginx/reverse-proxy,
      # слушающий на LAN-интерфейсе и проксирующий на 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://dgd:${POSTGRES_PASSWORD:-dgd}@db:5432/dgd"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      SEED_PASSWORD: "${SEED_PASSWORD:-demo1234}"
      SEED_DEMO_APPEALS: "${SEED_DEMO_APPEALS:-false}"
      SITE_LOGIN: "${SITE_LOGIN:-}"
      SITE_PASSWORD: "${SITE_PASSWORD:-}"

volumes:
  dgd_pg:
