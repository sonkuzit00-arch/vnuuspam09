<style>

}

let rf={from:"",to:"",resp:"",channel:""};
function reportData(){
  const from=rf.from?new Date(rf.from):null,to=rf.to?new Date(new Date(rf.to).getTime()+DAY):null;
  const A=db.appeals.filter(a=>{const d=new Date(a.received);if(from&&d<from)return false;if(to&&d>=to)return false;if(rf.resp&&a.responsible!==rf.resp)return false;
    if(rf.channel){if(rf.channel.startsWith("group:")){if(groupOf(a.channel)!==rf.channel.slice(6))return false}else if(a.channel!==rf.channel)return false}return true})
    .sort((x,y)=>x.received.localeCompare(y.received));
  const m={};for(const a of A){const d=new Date(a.received),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const r=m[k]||(m[k]={label:MONTHS[d.getMonth()]+" "+d.getFullYear(),total:0,resolved:0,positive:0,progress:0,overdue:0,gratitude:0,media:0});
    r.total++;if(a.stage==="RESOLVED")r.resolved++;if(isPositive(a))r.positive++;if(a.stage==="IN_PROGRESS")r.progress++;if(isOverdue(a))r.overdue++;if(a.gratitude)r.gratitude++;if(a.media)r.media++}
  const months=Object.keys(m).sort().map(k=>m[k]);
  const totals=months.reduce((t,r)=>{for(const k in t)if(k!=="label")t[k]+=r[k];return t},{label:"Итого",total:0,resolved:0,positive:0,progress:0,overdue:0,gratitude:0,media:0});
  return {A,months,totals,positive:A.filter(isPositive),gratitude:A.filter(a=>a.gratitude)};
}
const MCOLS=[["label","Месяц"],["total","Поступило"],["resolved","Решено"],["positive","Положительный результат"],["progress","В работе"],["overdue","Просрочено"],["gratitude","Благодарности"],["media","СМИ"]];
const RCOLS=[["Дата",a=>fmt(a.received)],["Заявитель",fullName],["Тема",a=>a.subject||a.goal],["Канал",a=>a.channel],["Категория",a=>a.category],["Ответственный",a=>user(a.responsible).name],["Статус",a=>STAGE_LABELS[a.stage]],["Положительный результат",a=>isPositive(a)?"Да":"Нет"],["Результат",a=>a.result||a.outgoing.map(o=>o.summary).filter(Boolean).join("; ")],["Благодарность",a=>a.gratitude?fmt(a.gratitudeAt)||"Да":""]];
function monthTable(d){return `<table><tr>${MCOLS.map(([,h],i)=>`<th class="${i?"n":""}">${h}</th>`).join("")}</tr>${[...d.months,d.totals].map((r,i,arr)=>`<tr class="${i===arr.length-1?"total":""}">${MCOLS.map(([k],j)=>`<td class="${j?"n":""}">${esc(r[k])}</td>`).join("")}</tr>`).join("")}</table>`}
function rowsTable(arr){return arr.length?`<table><tr>${RCOLS.map(([h])=>`<th>${h}</th>`).join("")}</tr>${arr.map(a=>`<tr>${RCOLS.map(([,f])=>`<td>${esc(f(a))}</td>`).join("")}</tr>`).join("")}</table>`:`<div class="muted">Нет за выбранный период.</div>`}
function viewReports(){
  const d=reportData();
  const chOpts=Object.entries(CHANNEL_GROUPS).flatMap(([g,cs])=>[[`group:${g}`,`${g} — все каналы`],...cs.map(c=>[c,"  "+c])]);
  return `<div><h1>Отчёты</h1><div class="muted">Итоги по месяцам, положительным результатам и благодарностям.</div></div>
  <div class="card no-print"><div class="grid g4" style="align-items:end">
   <label class="f">Начало периода<input type="date" data-rf="from" value="${rf.from}"></label><label class="f">Конец периода<input type="date" data-rf="to" value="${rf.to}"></label>
   <label class="f">Ответственный<select data-rf="resp"><option value="">Все</option>${db.users.map(u=>`<option value="${u.id}" ${rf.resp===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></label>
   <label class="f">Канал<select data-rf="channel"><option value="">Все каналы</option>${chOpts.map(([v,l])=>`<option value="${esc(v)}" ${rf.channel===v?"selected":""}>${esc(l)}</option>`).join("")}</select></label></div>
   <div class="row" style="margin-top:12px"><button class="btn" data-act="xls">Скачать Excel</button><button class="btn" data-act="print">PDF / печать</button><button class="btn ghost" data-act="csv">CSV</button></div></div>
  ${card("По месяцам",`<div class="scroll">${monthTable(d)}</div>`,"Положительный результат — обращение решено или орган власти оказал содействие")}
  ${card(`Положительные результаты · ${d.positive.length}`,`<div class="scroll">${rowsTable(d.positive)}</div>`)}
  ${card(`Благодарности · ${d.gratitude.length}`,`<div class="scroll">${rowsTable(d.gratitude)}</div>`)}`;
}
function exportXls(){
  const d=reportData();
  const sheet=(t,body)=>`<h3>${t}</h3>${body}<br>`;
  const html=`<html><head><meta charset="utf-8"></head><body>${sheet("По месяцам",monthTable(d))}${sheet("Положительные результаты",rowsTable(d.positive))}${sheet("Благодарности",rowsTable(d.gratitude))}${sheet("Все обращения",rowsTable(d.A))}</body></html>`;
  download(`report-${new Date().toISOString().slice(0,10)}.xls`,html,"application/vnd.ms-excel");
}
function exportCsv(){
  const d=reportData(),q=v=>/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
  const csv=[RCOLS.map(c=>c[0]),...d.A.map(a=>RCOLS.map(([,f])=>String(f(a))))].map(r=>r.map(q).join(",")).join("\n");
  download(`report-${new Date().toISOString().slice(0,10)}.csv`,"﻿"+csv,"text/csv");
}

function viewProfile(){
  const u=cur();
  return `<div><h1>Профиль</h1><div class="muted">${esc(u.name)} · ${esc(u.email)}</div></div>
  ${card("Уведомления",`<div class="stack"><label class="row"><input type="checkbox" id="pEmail" ${u.byEmail?"checked":""}> На почту</label><input id="pEmailAddr" placeholder="${esc(u.email)}" value="${esc(u.notifyEmail)}">
   <label class="row"><input type="checkbox" id="pTg" ${u.byTelegram?"checked":""} ${u.telegram?"":"disabled"}> В Telegram</label>
   ${u.telegram?`<div class="row"><span class="small" style="color:var(--ok)">Telegram привязан</span><button class="btn ghost sm" data-act="tgunlink">Отвязать</button></div>`:`<button class="btn sm" style="align-self:flex-start" data-act="tglink">Привязать Telegram</button>`}
   <div class="row"><button class="btn primary" data-act="saveprofile">Сохранить</button><button class="btn" data-act="testnotify">Проверить</button></div>
   <div class="small muted">Приходят: новое обращение или поручение на вас, передача обращения, выполнение вашего поручения, приближение сроков. В демо уведомления не отправляются.</div></div>`,"Каждый сотрудник настраивает сам")}`;
}

// ---------- Роутер и события ----------
function render(){
  if(!me||!db.users.find(u=>u.id===me)){$("#root").innerHTML=viewLogin();return}
  const h=location.hash||"#/";let c;
  if(h.startsWith("#/appeal/"))c=viewAppeal(h.slice(9));
  else c=({"#/new":viewNew,"#/summary":viewSummary,"#/reports":viewReports,"#/admin":viewAdmin,"#/profile":viewProfile}[h]||(cur().role==="VIEWER"?viewSummary:viewHome))();
  $("#root").innerHTML=shell(c);
}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});
const find=aid=>db.appeals.find(a=>a.id===aid);
function done(msg){save();render();if(msg)toast(msg)}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT")return;
  const act=b.dataset.act,a=b.dataset.id&&find(b.dataset.id);
  switch(act){
    case "login":me=$("#loginAs").value;try{sessionStorage.setItem(KEY+"-me",me)}catch{};location.hash="#/";render();break;
    case "logout":e.preventDefault();me=null;try{sessionStorage.removeItem(KEY+"-me")}catch{};render();break;
    case "reset":db=seed();save();toast("Демо-данные восстановлены");break;
    case "stage":a.stage=b.dataset.v;if(a.stage==="RESOLVED")a.resolvedAt=new Date().toISOString();log(a,"STAGE",`Статус изменён на «${STAGE_LABELS[a.stage]}»`);done("Статус: "+STAGE_LABELS[a.stage]);break;
    case "task":{const to=$("#tTo").value,desc=$("#tDesc").value.trim(),due=$("#tDue").value;if(!to||!desc)return toast("Выберите исполнителя и опишите поручение");
      a.tasks.push({id:id("t"),by:me,to,desc,status:"PENDING",at:new Date().toISOString(),due:due?new Date(due).toISOString():null});log(a,"NOTE",`Поручение для ${user(to).name}: ${desc}${due?` (срок — ${fmt(due)})`:""}`);done("Поручение создано");break}
    case "tstatus":{const t=a.tasks.find(x=>x.id===b.dataset.t);t.status=b.dataset.v;log(a,"STAGE",`Поручение: статус «${TASK_LABELS[t.status]}»`);done("Готово");break}
    case "reassign":{const to=$("#reTo").value;if(!to)return;a.responsible=to;log(a,"STAGE",`Обращение передано: ${user(to).name}`);done("Обращение передано");break}
    case "fdel":{const f=a.files.splice(+b.dataset.i,1)[0];log(a,"NOTE",`Удалён файл «${f.name}»`);done("Файл удалён");break}
    case "xls":exportXls();break;case "csv":exportCsv();break;case "print":window.print();break;
    case "adduser":{const name=$("#nuName").value.trim(),email=$("#nuEmail").value.trim().toLowerCase();if(name.length<2||!email.includes("@"))return toast("Укажите ФИО и email");
      if(db.users.some(u=>u.email===email))return toast("Такой email уже есть");db.users.push({id:id("u"),name,email,role:$("#nuRole").value,active:true,notifyEmail:"",byEmail:false,byTelegram:false,telegram:false});done("Пользователь создан");break}
    case "resetpw":toast("В полной версии здесь выдаётся новый пароль");break;
    case "block":{const u=user(b.dataset.id);u.active=!u.active;done(u.active?"Разблокирован":"Заблокирован");break}
    case "tglink":cur().telegram=true;cur().byTelegram=true;done("Telegram привязан (демо)");break;
    case "tgunlink":cur().telegram=false;cur().byTelegram=false;done("Telegram отвязан");break;
    case "saveprofile":{const u=cur();u.byEmail=$("#pEmail").checked;u.notifyEmail=$("#pEmailAddr").value.trim();u.byTelegram=$("#pTg").checked;done("Настройки сохранены");break}
    case "testnotify":toast("В демо уведомления не отправляются");break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.id&&find(t.dataset.id);
  if(t.dataset.field&&a){
    if(t.dataset.field==="route"){a.route=t.value;log(a,"STAGE",`КАУ: маршрут — «${t.value||"не назначен"}»`)}
    else if(t.dataset.field==="control")a.control=t.value?new Date(t.value).toISOString():null;
    else a[t.dataset.field]=t.value;
    done("Сохранено");
  }else if(t.dataset.flag&&a){
    a[t.dataset.flag]=t.checked;if(t.dataset.flag==="gratitude")a.gratitudeAt=t.checked?new Date().toISOString():null;
    log(a,t.dataset.flag==="gratitude"?"GRATITUDE":"MEDIA",t.dataset.flag==="gratitude"?(t.checked?"Благодарственное письмо отправлено":"Отметка о благодарности снята"):(t.checked?"Материал направлен в СМИ":"Отметка об СМИ снята"));done();
  }else if(t.dataset.act==="files"&&a){
    for(const f of t.files){const i=a.files.length;a.files.push({name:f.name,size:f.size,at:new Date().toISOString(),by:me});fileData[a.id+i]=URL.createObjectURL(f);log(a,"NOTE",`Приложен файл «${f.name}»`)}
    done("Файлы приложены");
  }else if(t.dataset.rf){rf[t.dataset.rf]=t.value;render()}
  else if(t.dataset.role){user(t.dataset.role).role=t.value;done("Роль изменена")}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="newForm")return;e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target));
  const a={id:id("a"),channel:f.channel,subject:f.subject,received:new Date().toISOString(),lastName:f.lastName,firstName:f.firstName,middleName:f.middleName,phone:f.phone,email:f.email,goal:f.goal,category:f.category,district:f.district,stage:"IN_PROGRESS",route:"",responsible:f.responsible,control:f.control?new Date(f.control).toISOString():null,result:"",gratitude:false,media:false,outgoing:[],tasks:[],files:[],events:[]};
  log(a,"CREATED",`Обращение зарегистрировано (${a.channel})`);db.appeals.unshift(a);save();location.hash="#/appeal/"+a.id;toast("Обращение зарегистрировано");
});
render();
</script>
</body>
</html>
